<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AlphaCast: cross-sectional equity ranking workstation with walk-forward validation, live signals, portfolio construction and model monitoring.">
    <meta name="color-scheme" content="dark light">
    <title>AlphaCast</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
    <script>
      try {
        const saved = localStorage.getItem('alphacast.theme');
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (error) { /* storage unavailable: keep the default theme */ }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Primary">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M7 23 13 15l4 4 8-10"/></svg>
          <div><strong>AlphaCast</strong><span>Equity ranking workstation</span></div>
        </div>
        <nav id="nav">
          <p class="nav-group">Signal</p>
          <a href="#/overview" data-view="overview"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg>Overview</a>
          <a href="#/screener" data-view="screener"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Screener</a>
          <a href="#/security" data-view="security"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Security</a>
          <a href="#/portfolio" data-view="portfolio"><svg viewBox="0 0 24 24"><path d="M12 3v9l7.8 4.5A9 9 0 1 1 12 3z"/><path d="M15 3.5A9 9 0 0 1 20.5 12H15z"/></svg>Portfolio</a>
          <p class="nav-group">Research</p>
          <a href="#/backtest" data-view="backtest"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Backtest</a>
          <a href="#/models" data-view="models"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Models</a>
          <a href="#/diagnostics" data-view="diagnostics"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Diagnostics</a>
          <a href="#/monitoring" data-view="monitoring"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Monitoring</a>
          <p class="nav-group">Workspace</p>
          <a href="#/runs" data-view="runs"><svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8z"/></svg>Runs</a>
        </nav>
        <div class="sidebar-foot">
          <a href="https://www.nathan-gomes.com/Project-AlphaCast.dc.html" target="_blank" rel="noreferrer">About the project ↗</a>
          <a href="https://github.com/Nathan-Gomes/alphacast/blob/main/docs/METHODOLOGY.md" target="_blank" rel="noreferrer">Methodology ↗</a>
          <a href="/api/docs" target="_blank" rel="noreferrer">API reference ↗</a>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="title-block">
            <h1 id="view-title">Overview</h1>
            <p id="view-subtitle"></p>
          </div>
          <div class="toolbar">
            <label class="field compact"><span>Workspace</span><select id="run-select" aria-label="Workspace run"></select></label>
            <label class="field compact"><span>Model</span><select id="model-select" aria-label="Active model"></select></label>
            <button class="icon-button" id="theme-button" type="button" aria-label="Switch to light theme" title="Switch to light theme"><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
            <a class="button primary" href="#/runs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New run</span></a>
          </div>
        </header>
        <div class="context-bar" id="context-bar" aria-live="polite"></div>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <div class="tooltip" id="tooltip" role="status" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
