# Keeps the shipped market snapshot and the default workspace current.
# Runs weekly after Friday's close. Nothing is committed unless the download
# passes its quality gate and the full test suite passes on the new data.
name: Refresh market data
on:
  schedule:
    - cron: "0 12 * * 6"   # Saturdays 12:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Download prices
        id: prices
        run: |
          python scripts/refresh_snapshot.py
          if git diff --quiet -- src/alphacast/snapshots/us_large_cap_prices.csv.gz; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the default workspace
        if: steps.prices.outputs.changed == 'true'
        run: python scripts/build_default_run.py
      - if: steps.prices.outputs.changed == 'true'
        run: python -m pytest -q
      - name: Commit
        id: commit
        if: steps.prices.outputs.changed == 'true'
        run: |
          last=$(python -c "import pandas as p; print(p.read_csv('src/alphacast/snapshots/us_large_cap_prices.csv.gz').date.max())")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/alphacast/snapshots
          git commit -m "Refresh market snapshot through $last"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No RENDER_DEPLOY_HOOK secret; deploy manually."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy triggered."
