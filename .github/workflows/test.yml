name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Interface logic tests
        run: node --test tests/js/*.test.mjs

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[dev]'
      - run: npm install --no-save --no-audit --no-fund axe-core@4
      - name: Start the app
        run: |
          uvicorn alphacast.app:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/health > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: axe audit of every view in both themes
        run: python scripts/a11y_audit.py --axe node_modules/axe-core/axe.min.js --base http://localhost:8000
