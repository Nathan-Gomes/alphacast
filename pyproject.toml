[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphacast"
version = "1.0.0"
description = "Walk-forward systematic equity ranking research"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "uvicorn>=0.30",
  "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
alphacast = "alphacast.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alphacast = ["web/*.html", "web/*.svg", "web/*.png", "web/*.js", "web/**/*.js", "web/*.css", "snapshots/*.gz"]
